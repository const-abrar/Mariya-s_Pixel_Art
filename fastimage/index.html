<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BROKEN CORNER | FastImage</title>
    <style>
        /* --- 1. BROKEN CORNER DESIGN SYSTEM --- */
        :root {
            /* Palette: Premium Soft Ash & Deep Slate */
            --bg-color: #e2e8f0;
            --text-brand: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            
            /* Status Colors adapted for Neumorphism */
            --success: #059669; 
            --warning: #d97706;

            /* Refined Neumorphic Shadows for compact UI */
            --shadow-dark: #cbd5e1;
            --shadow-light: #ffffff;
            
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-stack);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* --- 2. THE "BROKEN CORNER" CARD --- */
        .app-container {
            width: 100%;
            max-width: 380px; /* Compact width */
            background: var(--bg-color);
            /* THE BROKEN CORNER EFFECT: Top-Left is sharp */
            border-radius: 2px 28px 28px 28px; 
            padding: 28px 24px;
            box-shadow: 10px 10px 20px var(--shadow-dark), 
                       -10px -10px 20px var(--shadow-light);
            display: flex;
            flex-direction: column;
            gap: 20px; /* Tighter spacing */
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 4px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(100, 116, 139, 0.15);
        }

        .brand-name {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-brand);
            text-transform: uppercase;
        }

        .tool-name {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* --- 3. DROP ZONE --- */
        .drop-zone {
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            /* Inset shadow for a recessed drop area */
            box-shadow: inset 5px 5px 10px var(--shadow-dark), 
                        inset -5px -5px 10px var(--shadow-light);
        }

        .drop-zone.dragover {
            box-shadow: inset 8px 8px 16px var(--shadow-dark), 
                        inset -8px -8px 16px var(--shadow-light);
        }

        .drop-zone p { 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            font-weight: 600; 
            margin-top: 12px; 
            pointer-events: none; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .drop-zone .icon { 
            font-size: 28px; 
            pointer-events: none; 
            color: var(--text-muted);
        }
        
        #fileInput { display: none; }

        /* --- 4. EDITOR LAYOUT --- */
        .editor-container {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Preview Area */
        .preview-box {
            width: 100%;
            height: 180px; /* Compact height */
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), 
                        inset -5px -5px 10px var(--shadow-light);
        }

        .preview-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            border-radius: 8px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
