<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BROKEN CORNER | QR Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* --- 1. BROKEN CORNER DESIGN SYSTEM --- */
    :root {
      /* Palette: Premium Soft Ash & Deep Slate */
      --bg-color: #e2e8f0;
      --text-brand: #0f172a;
      --text-main: #334155;
      --text-muted: #64748b;
      
      /* Refined Neumorphic Shadows for compact UI */
      --shadow-dark: #cbd5e1;
      --shadow-light: #ffffff;
      
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px; 
    }

    /* --- 2. THE "BROKEN CORNER" CARD --- */
    .app-container {
      width: 100%;
      max-width: 380px; /* More compact width */
      background: var(--bg-color);
      /* THE BROKEN CORNER EFFECT: Top-Left is sharp, rest are rounded */
      border-radius: 2px 28px 28px 28px; 
      padding: 28px 24px;
      box-shadow: 10px 10px 20px var(--shadow-dark), 
                 -10px -10px 20px var(--shadow-light);
      display: flex;
      flex-direction: column;
      gap: 20px; /* Tighter spacing */
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 4px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(100, 116, 139, 0.15);
    }

    .brand-name {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-brand);
      text-transform: uppercase;
    }

    .tool-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* --- 3. COMPACT INPUTS --- */
    label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-color);
      border: none;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.85rem;
      resize: vertical;
      min-height: 80px; /* Shorter textarea */
      transition: var(--transition);
      box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                  inset -4px -4px 8px var(--shadow-light);
    }

    textarea:focus {
      outline: none;
      box-shadow: inset 6px 6px 12px var(--shadow-dark), 
                  inset -6px -6px 12px var(--shadow-light);
    }

    textarea::placeholder { color: #94a3b8; font-size: 0.8rem; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px; /* Tighter gap */
    }

    input[type="color"], select {
      width: 100%;
      height: 38px; /* Compact height */
      background: var(--bg-color);
      border: none;
      border-radius: 10px;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
      transition: var(--transition);
      box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                  inset -3px -3px 6px var(--shadow-light);
    }

    input[type="color"] {
      -webkit-appearance: none;
      padding: 3px;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { 
      border: none; 
      border-radius: 6px; 
    }

    select {
      padding: 0 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* --- 4. QR DISPLAY --- */
    .qr-wrapper {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg-color);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: var(--transition);
      overflow: hidden;
      box-shadow: inset 5px 5px 10px var(--shadow-dark), 
                  inset -5px -5px 10px var(--shadow-light);
    }

    .qr-wrapper.has-image {
      padding: 12px; /* Smaller padding */
      box-shadow: 5px 5px 10px var(--shadow-dark), 
                 -5px -5px 10px var(--shadow-light);
    }

    #qrImg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 6px;
    }

    #qrImg.loaded { opacity: 1; transform: scale(1); }

    .placeholder-icon {
      position: absolute;
      color: rgba(100, 116, 139, 0.5);
      width: 40px; /* Smaller icon */
      height: 40px;
      transition: var(--transition);
    }

    /* --- 5. COMPACT BUTTONS --- */
    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      padding: 12px; /* Slimmer buttons */
      border-radius: 12px;
      border: none;
      background: var(--bg-color);
      color: var(--text-brand);
      font-size: 0.85rem; /* Smaller font */
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: 5px 5px 10px var(--shadow-dark), 
                 -5px -5px 10px var(--shadow-light);
    }

    .btn:active:not(:disabled) { 
      box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                  inset -3px -3px 6px var(--shadow-light);
    }
    
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Loader */
    .loader {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: var(--text-brand);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- 6. MOBILE RESPONSIVENESS --- */
    @media (max-width: 480px) {
      .app-container {
        padding: 24px 20px;
        border-radius: 2px 24px 24px 24px;
      }
      .settings-grid { grid-template-columns: 1fr 1fr; }
      .setting-item:last-child { grid-column: span 2; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="brand-header">
    <div class="brand-name">Broken Corner</div>
    <div class="tool-name">QR STUDIO</div>
  </div>

  <div>
    <textarea id="text" placeholder="Enter URL, text, or crypto address..."></textarea>
  </div>

  <div class="settings-grid">
    <div class="setting-item">
      <label>Data</label>
      <input type="color" id="fgColor" value="#0f172a">
    </div>
    <div class="setting-item">
      <label>Base</label>
      <input type="color" id="bgColor" value="#ffffff">
    </div>
    <div class="setting-item">
      <label>Quality</label>
      <select id="eccLevel">
        <option value="L">Low</option>
        <option value="M" selected>Med</option>
        <option value="Q">High</option>
        <option value="H">Max</option>
      </select>
    </div>
  </div>

  <div class="qr-wrapper" id="qrContainer">
    <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 4v16m8-8H4" stroke-linecap="round"/>
    </svg>
    <img id="qrImg" crossorigin="anonymous" alt="Generated QR">
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="generateBtn" onclick="generateQR()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Generate
      <div class="loader" id="generateLoader"></div>
    </button>
    
    <button class="btn btn-secondary" id="downloadBtn" onclick="downloadQR()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Save 4K
    </button>
  </div>
</div>

<script>
  const qrImg = document.getElementById("qrImg");
  const qrContainer = document.getElementById("qrContainer");
  const downloadBtn = document.getElementById("downloadBtn");
  const generateBtn = document.getElementById("generateBtn");
  const loader = document.getElementById("generateLoader");
  const placeholder = document.querySelector('.placeholder-icon');

  function generateQR() {
    const text = document.getElementById("text").value.trim();
    
    if(!text) {
      const textarea = document.getElementById("text");
      textarea.style.boxShadow = "inset 4px 4px 8px #ffb3b3, inset -4px -4px 8px #ffffff";
      setTimeout(() => textarea.style.boxShadow = "", 800);
      return;
    }

    const fg = document.getElementById("fgColor").value.replace('#', '');
    const bg = document.getElementById("bgColor").value.replace('#', '');
    const ecc = document.getElementById("eccLevel").value;
    
    generateBtn.firstElementChild.style.display = "none"; 
    loader.style.display = "block";
    qrImg.classList.remove("loaded");

    const encoded = encodeURIComponent(text);
    const url = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encoded}&color=${fg}&bgcolor=${bg}&ecc=${ecc}&margin=0`;

    qrImg.onload = () => {
      qrContainer.classList.add("has-image");
      qrImg.classList.add("loaded");
      placeholder.style.opacity = '0';
      
      generateBtn.firstElementChild.style.display = "block";
      loader.style.display = "none";
      downloadBtn.disabled = false;
    };

    qrImg.onerror = () => {
      alert("Network error: Could not generate QR.");
      generateBtn.firstElementChild.style.display = "block";
      loader.style.display = "none";
    };

    qrImg.src = url;
  }

  function downloadQR() {
    if(!qrImg.src || !qrImg.classList.contains("loaded")) return;

    const originalText = downloadBtn.innerHTML;
    downloadBtn.innerHTML = "Processing...";
    downloadBtn.disabled = true;

    setTimeout(() => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 3840;
        canvas.height = 3840;
        const ctx = canvas.getContext("2d");
        
        ctx.imageSmoothingEnabled = false; 
        ctx.drawImage(qrImg, 0, 0, 3840, 3840);
        
        const link = document.createElement("a");
        link.download = "BrokenCorner_QR_4K.jpeg";
        link.href = canvas.toDataURL("image/jpeg", 1.0);
        link.click();
      } catch (e) {
        alert("Cross-origin security blocked the download on this browser.");
      } finally {
        downloadBtn.innerHTML = originalText;
        downloadBtn.disabled = false;
      }
    }, 50);
  }
</script>

</body>
</html>
