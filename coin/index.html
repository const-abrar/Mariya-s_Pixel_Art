<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Coin Toss</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neu': '#e0e5ec', // Classic neumorphism background
                    },
                    boxShadow: {
                        'out': '9px 9px 16px rgb(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.5)',
                        'in': 'inset 6px 6px 10px 0 rgba(163, 177, 198, 0.7), inset -6px -6px 10px 0 rgba(255, 255, 255, 0.8)',
                        'out-sm': '5px 5px 10px rgb(163, 177, 198, 0.6), -5px -5px 10px rgba(255, 255, 255, 0.5)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e0e5ec;
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        @keyframes spinX {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(360deg); }
        }
        /* Custom animation for smooth spinning */
        .spinning {
            animation: spinX 0.25s linear infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen m-0 font-sans select-none overflow-hidden">

    <h1 id="secret-title" class="text-2xl font-bold text-gray-500 mb-20 tracking-widest cursor-pointer active:scale-95 transition-transform px-6 py-3 rounded-xl">
        NEUMORPHIC COIN
    </h1>
    <p class="text-gray-400 mb-10 text-sm">Tap the coin to toss!</p>

    <div class="relative w-40 h-40 flex items-center justify-center">
        <div id="coin-wrapper" class="w-full h-full transition-transform duration-700 ease-in-out z-10 cursor-pointer">
            <div id="coin" class="relative w-full h-full rounded-full shadow-out preserve-3d transition-transform duration-300">
                
                <div class="absolute inset-0 rounded-full flex items-center justify-center bg-neu backface-hidden border-[6px] border-neu">
                    <span class="font-extrabold text-5xl text-gray-600 drop-shadow-md">H</span>
                </div>
                
                <div class="absolute inset-0 rounded-full flex items-center justify-center bg-neu backface-hidden border-[6px] border-neu" style="transform: rotateX(180deg);">
                    <span class="font-extrabold text-5xl text-gray-600 drop-shadow-md">T</span>
                </div>
                
            </div>
        </div>
    </div>

    <div id="cheat-modal" class="fixed inset-0 bg-neu/80 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-neu shadow-out p-8 rounded-3xl flex flex-col items-center w-80">
            <h2 class="text-xl font-bold text-gray-600 mb-6 text-center">CHEAT ACTIVATED<br><span class="text-sm font-normal text-gray-400">Select Next Outcome</span></h2>
            
            <div class="flex gap-6 w-full justify-center">
                <button onclick="setCheat('H')" class="w-16 h-16 rounded-full shadow-out active:shadow-in text-gray-600 font-bold text-xl transition-all">H</button>
                <button onclick="setCheat('T')" class="w-16 h-16 rounded-full shadow-out active:shadow-in text-gray-600 font-bold text-xl transition-all">T</button>
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('coin-wrapper');
        const coin = document.getElementById('coin');
        const cheatModal = document.getElementById('cheat-modal');
        const secretTitle = document.getElementById('secret-title');

        let isSpinning = false;
        let forcedOutcome = null; // Stores H or T if cheated
        
        // --- COIN TOSS LOGIC ---
        wrapper.addEventListener('click', () => {
            if (!isSpinning) {
                // Phase 1: Tap to fly and spin
                isSpinning = true;
                wrapper.style.transform = 'translateY(-200px)'; // Flies up
                coin.classList.add('spinning'); // Starts infinite spin
                coin.style.transform = ''; // Clear strict rotations
            } else {
                // Phase 2: Tap to stop
                isSpinning = false;
                coin.classList.remove('spinning');
                
                // Determine Result (Use cheat if active, else random)
                let result = '';
                if (forcedOutcome) {
                    result = forcedOutcome;
                    forcedOutcome = null; // Reset after one use
                } else {
                    result = Math.random() > 0.5 ? 'H' : 'T';
                }

                // Apply the final face rotation to stop on H or T
                if (result === 'H') {
                    coin.style.transform = 'rotateX(0deg)';
                } else {
                    coin.style.transform = 'rotateX(180deg)';
                }

                // Bring back down
                wrapper.style.transform = 'translateY(0)';
            }
        });

        // --- CHEAT CODE LOGIC ---
        let tapCount = 0;
        let tapTimer;

        secretTitle.addEventListener('click', () => {
            tapCount++;
            
            // Reset tap count if user pauses for more than 400ms
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => {
                tapCount = 0;
            }, 400);

            if (tapCount >= 5) {
                tapCount = 0; // Reset
                showCheatModal();
            }
        });

        function showCheatModal() {
            cheatModal.classList.remove('hidden');
            setTimeout(() => cheatModal.classList.remove('opacity-0'), 10);
        }

        function setCheat(outcome) {
            forcedOutcome = outcome;
            
            // Close Modal smoothly
            cheatModal.classList.add('opacity-0');
            setTimeout(() => {
                cheatModal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
